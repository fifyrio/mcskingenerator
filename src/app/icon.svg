<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- dirt body -->
  <rect x="2" y="2" width="28" height="28" fill="#8A5A36"/>
  <!-- grass top -->
  <rect x="2" y="2" width="28" height="9" fill="#3E8E2A"/>
  <!-- grass drips -->
  <rect x="2" y="11" width="5" height="3" fill="#3E8E2A"/>
  <rect x="12" y="11" width="6" height="3" fill="#3E8E2A"/>
  <rect x="24" y="11" width="4" height="3" fill="#3E8E2A"/>
  <!-- grass highlight -->
  <rect x="5" y="4" width="6" height="2" fill="#5BB637"/>
  <rect x="17" y="4" width="5" height="2" fill="#5BB637"/>
  <!-- dirt speckles -->
  <rect x="8" y="18" width="3" height="3" fill="#5A3A24"/>
  <rect x="19" y="22" width="3" height="3" fill="#5A3A24"/>
  <rect x="23" y="17" width="2" height="2" fill="#5A3A24"/>
  <rect x="6" y="25" width="2" height="2" fill="#5A3A24"/>
  <!-- ink outline -->
  <rect x="2" y="2" width="28" height="28" fill="none" stroke="#1B1B1F" stroke-width="3"/>
</svg>
